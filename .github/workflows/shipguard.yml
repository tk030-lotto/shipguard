name: Shipguard Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Pre-Launch Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Shipguard Audit
        run: npx shipguard scan --strict --format markdown --output audit-report.md

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipguard-audit-report
          path: audit-report.md
